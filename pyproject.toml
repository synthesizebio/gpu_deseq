[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-deseq"
version = "0.1.0"
description = "GPU-accelerated DESeq2-style differential expression analysis in Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "formulaic>=1.0",
  "numba>=0.59",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
